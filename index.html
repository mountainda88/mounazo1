<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>まうなぞ1</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="startScreen" class="screen active start-screen">
      <div class="eyebrow">WEB 謎解き</div>
      <h1>まうなぞ1</h1>
      <p class="lead">すべての謎を解き、最後の答えにたどり着け。</p>

      <button id="startBtn" class="primary">START</button>
      <button id="resetBtn" class="text-btn">進捗をリセット</button>
    </section>

    <section id="gameScreen" class="screen game-screen">
      <nav id="questionNav" class="question-nav" aria-label="問題ナビゲーション"></nav>

      <div class="game-header">
  <div>
    <div class="eyebrow">QUESTION</div>
    <h2 id="questionTitle">Q1</h2>
  </div>

  <div class="game-info">
    <div id="liveTimer" class="live-timer">00:00.00</div>
    <div id="progressText" class="progress-text">1 / 6</div>
  </div>
</div>

      <div class="progress-bar" aria-hidden="true">
        <div id="progressBar"></div>
      </div>

      <section class="question-area">
        <div id="questionImageWrap" class="image-wrap">
          <img id="questionImage" alt="謎画像">
        </div>

        <div id="questionText" class="question-text"></div>

        <form id="answerForm" class="answer-form">
          <label for="answerInput">ANSWER</label>

          <div class="answer-row">
            <input
              id="answerInput"
              type="text"
              autocomplete="off"
              placeholder="答えを入力"
              required
            >
            <button class="answer-button" type="submit">
              SUBMIT
            </button>
          </div>
        </form>

        <p id="message" class="message" aria-live="polite"></p>

        <details class="hint-box">
          <summary>HINT</summary>
          <p id="hintText"></p>
        </details>
      </section>
    </section>

    <section id="clearScreen" class="screen clear-screen">
  <div class="eyebrow">まうなぞ1  ALL CLEAR</div>
  <h1>CONGRATULATIONS</h1>

  <div class="clear-time-wrap">
    <div class="clear-time-label">CLEAR TIME</div>
    <div id="clearTime" class="clear-time">00:00.00</div>
  </div>

  <p class="lead">まうなぞ1のすべての謎を解き明かした。</p>
  <button id="restartBtn" class="primary">PLAY AGAIN</button>
</section>
<div id="resetModal" class="modal">
  <div class="modal-panel">
    <div class="eyebrow">RESET</div>
    <h3>最初からやり直しますか？</h3>
    <p>進捗とタイムがすべてリセットされます。</p>

    <div class="modal-actions">
      <button id="cancelResetBtn" class="modal-button ghost">CANCEL</button>
      <button id="confirmResetBtn" class="modal-button danger">RESET</button>
    </div>
  </div>
</div>

<div id="finalJudgeOverlay" class="final-judge-overlay"></div>
<div id="clearOverlay" class="clear-overlay">
  <div class="clear-overlay-text">
    <div class="eyebrow">FINAL ANSWER</div>
    <div class="clear-overlay-main">ほんとうにすごい</div>
  </div>
</div>

<div id="correctOverlay" class="correct-overlay">
  <div class="correct-overlay-content">
    <div class="correct-label">ANSWER</div>
    <div class="correct-main">CORRECT</div>
  </div>
</div>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
